<td class="{{ include.element.classes | join ' ' }}" rowspan="{{ include.rowspan }}">
{%- for reading in include.element.readings -%}
  {% if forloop.last == false %}
    <a href="{{ reading.link | relative_url }}">{{ reading.name }},</a>
  {% else %}
    <a href="{{ reading.link | relative_url }}">{{ reading.name }}</a>
  {% endif %}
{%- endfor -%}
</td>
